[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memphis-dock"
version = "0.1.0"
description = "Agentic autonomous unloading/offloading dock for slack-water inland ports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["dockcore", "brutegenius", "console", "edge", "mcp_server", "sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
